* { box-sizing: border-box; margin: 0; padding: 0; }

#breadcrumb { font-size: 13px; color: #94a3b8; }

#main { display: flex; flex: 1; overflow: hidden; }
#sidebar { width: 210px; background: #1e293b; border-right: 1px solid #334155; overflow-y: auto; flex-shrink: 0; padding: 8px 0; }
.tab { display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 7px 12px; background: none; border: none; color: #94a3b8; font-size: 12px; cursor: pointer; text-align: left; transition: background 0.15s; border-left: 3px solid transparent; }
.tab:hover { background: #263348; color: #e2e8f0; }
.tab.active { background: #1e3a5f; border-left-color: #a78bfa; color: #e0f2fe; }
.badge { background: rgba(167,139,250,0.15); color: #a78bfa; font-size: 10px; padding: 1px 5px; border-radius: 8px; flex-shrink: 0; }
.tab.active .badge { background: rgba(167,139,250,0.25); }
#content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
#viewer { flex: 1; position: relative; overflow: hidden; cursor: grab; user-select: none; background: #0f172a; }
#viewer.dragging { cursor: grabbing; }
#main-img { position: absolute; transform-origin: 0 0; display: block; max-width: none; }
#zoom-badge { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.6); color: #94a3b8; font-size: 11px; padding: 2px 7px; border-radius: 10px; pointer-events: none; }
#nav { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 6px; background: #1e293b; border-top: 1px solid #334155; flex-shrink: 0; }
#nav button { background: #334155; border: none; color: #e2e8f0; padding: 4px 12px; border-radius: 4px; cursor: pointer; font-size: 13px; }
#nav button:hover { background: #475569; }
#nav button:disabled { opacity: 0.3; cursor: default; }
#btn-play { min-width: 88px; }
#btn-play.playing { background: #7c3aed; color: #fff; }
#speed-select, #mode-select { background: #334155; border: 1px solid #475569; color: #e2e8f0; padding: 4px 8px; border-radius: 4px; font-size: 13px; cursor: pointer; }
#speed-select:focus, #mode-select:focus { outline: none; border-color: #a78bfa; }
#speed-select option:checked { background: #3730a3; }
#slide-num { font-size: 12px; color: #94a3b8; min-width: 80px; text-align: center; }
#thumbs { display: flex; gap: 4px; padding: 6px; background: #0f172a; border-top: 1px solid #1e293b; overflow-x: auto; flex-shrink: 0; height: 72px; align-items: center; }

.thumb.active { border-color: #a78bfa; opacity: 1; }

let curGroup = 0, curSlide = 0;
let scale = 1, tx = 0, ty = 0;
let dragging = false, startX, startY, startTx, startTy;

const viewer = document.getElementById('viewer');
const img = document.getElementById('main-img');
const badge = document.getElementById('zoom-badge');
const breadcrumb = document.getElementById('breadcrumb');
const slideNum = document.getElementById('slide-num');
const thumbsEl = document.getElementById('thumbs');
const sidebar = document.getElementById('sidebar');
const btnPrev = document.getElementById('btn-prev');
const btnNext = document.getElementById('btn-next');

function applyTransform() {
  img.style.transform = `matrix(${scale},0,0,${scale},${tx},${ty})`;
  badge.textContent = Math.round(scale * 100) + '%';
}

function fitImage() {
  const PAD = 24;
  if (!img.naturalWidth) return;
  scale = Math.min((viewer.clientWidth - PAD*2) / img.naturalWidth,
                   (viewer.clientHeight - PAD*2) / img.naturalHeight);
  tx = (viewer.clientWidth - img.naturalWidth * scale) / 2;
  ty = (viewer.clientHeight - img.naturalHeight * scale) / 2;
  applyTransform();
}

function loadSlide(gIdx, sIdx) {
  const group = GROUPS[gIdx];
  if (!group || sIdx < 0 || sIdx >= group.images.length) return;
  curGroup = gIdx; curSlide = sIdx;
  img.onload = fitImage;
  img.src = group.images[sIdx].file;
  breadcrumb.textContent = '— ' + group.label;
  slideNum.textContent = (sIdx + 1) + ' / ' + group.images.length;
  btnPrev.disabled = sIdx === 0;
  btnNext.disabled = sIdx === group.images.length - 1;
  document.querySelectorAll('.thumb').forEach((t, i) => t.classList.toggle('active', i === sIdx));
  const active = document.querySelector('.thumb.active');
  if (active) active.scrollIntoView({behavior: 'smooth', inline: 'center', block: 'nearest'});
  document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', i === gIdx));
}

function buildSidebar() {
  sidebar.innerHTML = '';
  GROUPS.forEach((g, i) => {
    const btn = document.createElement('button');
    btn.className = 'tab' + (i === 0 ? ' active' : '');
    btn.innerHTML = '<span>' + g.label + '</span><span class="badge">' + g.images.length + '</span>';
    btn.onclick = () => switchGroup(i);
    sidebar.appendChild(btn);
  });
}

function switchGroup(idx) {
  curGroup = idx; curSlide = 0;
  buildThumbs();
  loadSlide(curGroup, 0);
}

function buildThumbs() {
  thumbsEl.innerHTML = '';
  GROUPS[curGroup].images.forEach((entry, i) => {
    const t = document.createElement('img');
    t.className = 'thumb' + (i === 0 ? ' active' : '');
    t.src = entry.file;
    t.onclick = () => loadSlide(curGroup, i);
    thumbsEl.appendChild(t);
  });
}

buildSidebar();
buildThumbs();
loadSlide(0, 0);

btnPrev.onclick = () => { if (curSlide > 0) loadSlide(curGroup, curSlide - 1); };
btnNext.onclick = () => { if (curSlide < GROUPS[curGroup].images.length - 1) loadSlide(curGroup, curSlide + 1); };

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') btnNext.click();
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') btnPrev.click();
});

viewer.addEventListener('wheel', e => {
  e.preventDefault();
  const factor = e.deltaY < 0 ? 1.13 : 1/1.13;
  const newScale = Math.min(Math.max(scale * factor, 0.1), 25);
  const vr = viewer.getBoundingClientRect();
  const cx = e.clientX - vr.left, cy = e.clientY - vr.top;
  tx = cx - (cx - tx) * (newScale / scale);
  ty = cy - (cy - ty) * (newScale / scale);
  scale = newScale;
  applyTransform();
}, {passive: false});

viewer.addEventListener('mousedown', e => {
  dragging = true; viewer.classList.add('dragging');
  startX = e.clientX; startY = e.clientY; startTx = tx; startTy = ty;
  e.preventDefault();
});
document.addEventListener('mousemove', e => {
  if (!dragging) return;
  tx = startTx + e.clientX - startX;
  ty = startTy + e.clientY - startY;
  applyTransform();
});
document.addEventListener('mouseup', () => { dragging = false; viewer.classList.remove('dragging'); });
viewer.addEventListener('dblclick', fitImage);
window.addEventListener('resize', fitImage);
img.addEventListener('load', fitImage);

let autoInterval = null;
const btnPlay = document.getElementById('btn-play');
const speedSelect = document.getElementById('speed-select');
const modeSelect = document.getElementById('mode-select');

function autoNext() {
  const group = GROUPS[curGroup];
  if (curSlide < group.images.length - 1) {
    loadSlide(curGroup, curSlide + 1);
  } else if (modeSelect.value === 'book') {
    switchGroup((curGroup + 1) % GROUPS.length);
  } else {
    loadSlide(curGroup, 0);
  }
}

function stopAuto() {
  clearInterval(autoInterval);
  autoInterval = null;
  btnPlay.textContent = '▶ 自動';
  btnPlay.classList.remove('playing');
}

btnPlay.onclick = () => {
  if (autoInterval) {
    stopAuto();
  } else {
    autoInterval = setInterval(autoNext, parseInt(speedSelect.value));
    btnPlay.textContent = '⏸ 暫停';
    btnPlay.classList.add('playing');
  }
};

speedSelect.addEventListener('change', () => {
  if (autoInterval) {
    clearInterval(autoInterval);
    autoInterval = setInterval(autoNext, parseInt(speedSelect.value));
  }
});

document.addEventListener('keydown', e => {
  if (e.key === ' ') { e.preventDefault(); btnPlay.click(); }
});
</script>
